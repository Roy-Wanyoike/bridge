name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  go-generator-verify:
    name: Verify generated Go code
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: npm ci
      - run: npm run build
      - name: Generate + vet + test Go output
        run: |
          if [ -f scripts/verify-go.sh ]; then bash scripts/verify-go.sh; else echo "verify-go.sh not yet present — skipping"; fi

  rust-generator-verify:
    name: Verify generated Rust code
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: npm ci
      - run: npm run build
      - name: Generate + check + test Rust output
        run: |
          if [ -f scripts/verify-rust.sh ]; then bash scripts/verify-rust.sh; else echo "verify-rust.sh not yet present — skipping"; fi
